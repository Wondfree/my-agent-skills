name: Validate Agent Skills

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate all skills and syntax
        run: python3 scripts/validate_skills.py
      - name: Smoke test installation and backups
        run: python3 scripts/test_install.py
      - name: Test global instructions update approval gate
        run: python3 -B scripts/test_update.py
      - name: Test safe macOS uninstall planning (mocked Trash)
        run: python3 -B skills/macos-app-uninstaller/scripts/test_uninstaller.py
      - name: Test read-only Git lifecycle inventory
        run: python3 -B skills/git-lifecycle/scripts/test_git_lifecycle.py
      - name: Review static portability leads
        run: |
          python3 skills/skill-reviewer/scripts/audit_skill.py skills/video-to-knowledge
          python3 skills/skill-reviewer/scripts/audit_skill.py skills/skill-reviewer
          python3 skills/skill-reviewer/scripts/audit_skill.py skills/macos-app-uninstaller

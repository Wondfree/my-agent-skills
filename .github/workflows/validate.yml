name: Validate Agent Skills

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate all skills and syntax
        run: python3 scripts/validate_skills.py
      - name: Smoke test installation and backups
        run: python3 scripts/test_install.py
      - name: Test interactive installer selection and safety
        run: python3 -B scripts/test_install_wizard.py
      - name: Test global instructions update approval gate
        run: python3 -B scripts/test_update.py
      - name: Test safe macOS uninstall planning (mocked Trash)
        run: python3 -B -m unittest discover -s skills/macos-app-uninstaller/scripts -p 'test_*.py'
      - name: Test read-only Git lifecycle inventory
        run: python3 -B skills/git-lifecycle/scripts/test_git_lifecycle.py
      - name: Test inert Git lifecycle hook bridge
        run: python3 -B skills/git-lifecycle/scripts/test_hook_bridge.py
      - name: Test skill audit and CI validator regressions
        run: python3 -B skills/skill-reviewer/scripts/test_audit_skill.py
      - name: Review static portability leads
        run: |
          for skill in skills/*/SKILL.md; do
            python3 -B skills/skill-reviewer/scripts/audit_skill.py "$(dirname "$skill")" || exit "$?"
          done
